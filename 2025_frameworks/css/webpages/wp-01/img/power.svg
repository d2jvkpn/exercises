<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 发光底座 -->
  <ellipse cx="50" cy="80" rx="30" ry="8" fill="url(#glow)"></ellipse>

  <!-- 蓝色波形线 -->
  <polyline points="20,60 30,50 40,65 50,40 60,70 70,50 80,60" stroke="#00bfff" stroke-width="3" fill="none" stroke-linecap="round"></polyline>

  <!-- 光圈渐变 -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00bfff" stop-opacity="0.6"></stop>
      <stop offset="100%" stop-color="#001f3f" stop-opacity="0"></stop>
    </radialGradient>
  </defs>
</svg>
