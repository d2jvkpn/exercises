<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 发光底座 -->
  <ellipse cx="50" cy="85" rx="25" ry="6" fill="url(#glow)"></ellipse>

  <!-- 定位图标 -->
  <g transform="translate(30, 20)">
    <path d="M20,0
             C9,0 0,9 0,20
             C0,32 20,55 20,55
             C20,55 40,32 40,20
             C40,9 31,0 20,0 Z" fill="#00bfff" stroke="#0099ff" stroke-width="2"></path>

    <circle cx="20" cy="20" r="6" fill="#ffffff"></circle>
  </g>

  <!-- 渐变定义 -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00bfff" stop-opacity="0.6"></stop>
      <stop offset="100%" stop-color="#001f3f" stop-opacity="0"></stop>
    </radialGradient>
  </defs>
</svg>
