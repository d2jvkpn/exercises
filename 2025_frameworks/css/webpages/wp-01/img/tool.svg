<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00BFFF" stop-opacity="0.6"></stop>
      <stop offset="100%" stop-color="transparent"></stop>
    </radialGradient>

    <linearGradient id="gearGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66CCFF"></stop>
      <stop offset="100%" stop-color="#007BFF"></stop>
    </linearGradient>
  </defs>

  <!-- 发光底座 -->
  <ellipse cx="64" cy="112" rx="36" ry="8" fill="url(#glow)"></ellipse>

  <!-- 齿轮主体 -->
  <g transform="translate(64,64)" fill="url(#gearGrad)">
    <!-- 中心圆盘 -->
    <circle r="28"></circle>

    <!-- 中心空孔 -->
    <circle r="10" fill="#002244"></circle>

    <!-- 六个齿，等角度旋转 -->
    <g>
      <g transform="rotate(0)">
        <rect x="-3" y="-46" width="6" height="14" rx="2"></rect>
      </g>
      <g transform="rotate(60)">
        <rect x="-3" y="-46" width="6" height="14" rx="2"></rect>
      </g>
      <g transform="rotate(120)">
        <rect x="-3" y="-46" width="6" height="14" rx="2"></rect>
      </g>
      <g transform="rotate(180)">
        <rect x="-3" y="-46" width="6" height="14" rx="2"></rect>
      </g>
      <g transform="rotate(240)">
        <rect x="-3" y="-46" width="6" height="14" rx="2"></rect>
      </g>
      <g transform="rotate(300)">
        <rect x="-3" y="-46" width="6" height="14" rx="2"></rect>
      </g>
    </g>
  </g>
</svg>
