<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>纯 CSS 左侧菜单滑动示例</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans",
        sans-serif;
      background-color: #f1f5f9; /* 类似 bg-slate-100 */
      color: #0f172a;
    }

    /* 顶部栏 */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px; /* h-12 */
      background-color: #1f2937; /* 类似 bg-slate-800 */
      color: #ffffff;
      display: flex;
      align-items: center;
      padding: 0 16px;
      z-index: 20;
    }

    .topbar-title {
      font-weight: 600;
    }

    /* 汉堡按钮 */
    .hamburger-btn {
      margin-right: 16px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .hamburger-line {
      display: block;
      width: 24px;
      height: 2px;
      background-color: #ffffff;
      margin-bottom: 4px;
    }

    .hamburger-line:last-child {
      margin-bottom: 0;
    }

    /* 侧边栏 */
    .sidebar {
      position: fixed;
      top: 48px; /* 顶部栏高度 */
      left: 0;
      bottom: 0;
      width: 256px; /* 64 * 4px (tailwind w-64) */
      background-color: #020617; /* 类似 bg-slate-900 */
      color: #ffffff;
      z-index: 10;

      /* 动画相关 */
      transform: translateX(0);
      transition: transform 0.3s ease-in-out; /* duration-300 ease-in-out */
    }

    .sidebar-header {
      font-size: 18px;
      font-weight: 600;
      padding: 16px;
      border-bottom: 1px solid #334155; /* border-slate-700 */
    }

    .sidebar-item {
      padding: 16px;
      cursor: pointer;
      user-select: none;
    }

    .sidebar-item:hover {
      background-color: #111827; /* 类似 hover:bg-slate-800 */
    }

    /* 侧边栏状态：收起/展开 */
    .sidebar-closed {
      transform: translateX(-100%);
    }

    .sidebar-open {
      transform: translateX(0);
    }

    /* 主内容区域 */
    .main {
      padding-top: 48px; /* 顶部栏高度 */
      transition: margin-left 0.3s ease-in-out;
    }

    .main-shifted {
      margin-left: 256px; /* 与侧边栏宽度一致 */
    }

    .main-inner {
      padding: 16px;
    }

    .main-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .mb-2 {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <!-- Top Bar -->
  <div class="topbar">
    <!-- Toggle 按钮 -->
    <button id="toggleSidebar" class="hamburger-btn">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <div class="topbar-title">My App</div>
  </div>

  <!-- Sidebar -->
  <div id="sidebar" class="sidebar">
    <div class="sidebar-header">Menu</div>
    <div class="sidebar-item">Item 1</div>
    <div class="sidebar-item">Item 2</div>
    <div class="sidebar-item">Item 3</div>
  </div>

  <!-- Main Content -->
  <div id="main" class="main">
    <div class="main-inner">
      <h1 class="main-title">主内容区域</h1>
      <p class="mb-2">
        点击左上角的汉堡按钮，可以滑动显示 / 隐藏左侧菜单栏。
      </p>
      <p>
        这是一些示例文本。你可以在这里放页面内容、表格、图表等。
      </p>
    </div>
  </div>

  <!-- 简单的 JS 控制显示/隐藏 -->
  <script>
    const btnSidebar = document.getElementById('toggleSidebar');
    const sidebar = document.getElementById('sidebar');
    const main = document.getElementById('main');
    let open = true;

    function toggleSidebar(openNow) {
      if (openNow) {
        sidebar.classList.remove('sidebar-closed');
        sidebar.classList.add('sidebar-open');
        main.classList.add('main-shifted');
      } else {
        sidebar.classList.remove('sidebar-open');
        sidebar.classList.add('sidebar-closed');
        main.classList.remove('main-shifted');
      }
    }

    function applyLayoutByWidth() {
      open = window.innerWidth >= 1024; // ≥1024 时默认展开
      toggleSidebar(open);
    }

    window.addEventListener('load', applyLayoutByWidth);
    window.addEventListener('resize', applyLayoutByWidth);

    btnSidebar.addEventListener('click', () => {
      open = !open;
      toggleSidebar(open);
    });
  </script>
</body>
</html>
