<svg width="192" height="48" viewBox="0 0 192 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 渐变描边 -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFFF"></stop>
      <stop offset="100%" stop-color="#007BFF"></stop>
    </linearGradient>

    <!-- 蓝色发光滤镜 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>

  <!-- 图标背景形状 -->
  <path d="
    M16,0 
    H182 
    A6,6 0 0 1 188,6 
    V38 
    A10,10 0 0 1 178,48 
    H10 
    A10,10 0 0 1 0,38 
    V16 
    A16,16 0 0 1 16,0 
    Z" fill="rgba(0, 123, 255, 0.2)" stroke="url(#strokeGrad)" stroke-width="2" filter="url(#glow)"></path>
</svg>
